version: 2

updates:
  # Actions are pinned to commit SHAs, which is safe but invisible: a pinned SHA
  # never tells you it is out of date. Dependabot is what turns that pin from
  # "frozen" into "deliberate", and it rewrites both the SHA and the version
  # comment next to it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/envs/dev
      - /infra/modules/project-services
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
