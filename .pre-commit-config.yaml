# Local gates, so CI tells you about real problems rather than formatting.
# Install once:   pre-commit install
#
# These mirror the first three steps of .github/workflows/infra.yml. CI remains
# the authority — a hook can be skipped with --no-verify, a required status check
# cannot.

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.102.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        exclude: ^infra/envs/ # needs a backend and credentials; CI does this one
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key # there should never be a key in this repo at all
